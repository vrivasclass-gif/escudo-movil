name: Compilar APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar en Releases (ej. 0.2.0). Vacío = solo compilar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la firma
        env:
          KEYSTORE_B64: ${{ secrets.ESCUDO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/escudo.jks"
            echo "ESCUDO_KEYSTORE_PATH=$RUNNER_TEMP/escudo.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secreto ESCUDO_KEYSTORE_B64: el APK se firma con una clave de depuración temporal."
          fi

      - name: Versión
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          elif [ -n "$INPUT_VERSION" ]; then
            echo "VERSION_NAME=v${INPUT_VERSION#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${INPUT_VERSION#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Pruebas y compilación
        env:
          ESCUDO_KEYSTORE_PASSWORD: ${{ secrets.ESCUDO_KEYSTORE_PASSWORD }}
          ESCUDO_KEY_ALIAS: ${{ secrets.ESCUDO_KEY_ALIAS }}
          ESCUDO_KEY_PASSWORD: ${{ secrets.ESCUDO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Escudo-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Escudo-${{ env.VERSION_NAME }}
          path: Escudo-*.apk

      - name: Publicar versión
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Escudo ${{ env.RELEASE_TAG }}
          files: Escudo-*.apk
          generate_release_notes: true
